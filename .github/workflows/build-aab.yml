name: Build Signed Android App Bundle

on:
  push:
    branches: ["recovered-main", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.6

      - name: Decode Original Production Keystore
        run: |
          rm -f app/release.keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Verify Keystore Location
        run: ls -la app/

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Signed Release AAB
        run: ./gradlew :app:bundleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-rush-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Build Signed Release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Decode Consistent Debug Keystore
        run: |
          base64 --decode < debug.keystore.base64 > app/debug.keystore

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-rush-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-rush-release-apk
          path: app/build/outputs/apk/release/app-release.apk
