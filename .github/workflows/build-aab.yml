name: Build Signed Android App Bundle (AAB)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  build:
    name: Build Signed Release App Bundle
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Download Fresh Gradle Wrapper
      run: gradle wrapper

    - name: Grant Execute Permission for Gradle Wrapper
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Signed Release App Bundle (AAB)
      run: ./gradlew :app:bundleRelease --no-daemon

    - name: Upload Signed AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: neon-rush-release-aab
        path: app/build/outputs/bundle/release/app-release.aab
        if-no-files-found: error
        retention-days: 7
