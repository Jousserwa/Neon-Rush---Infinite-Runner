name: Build Signed Android App Bundle

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # This step forces GitHub to download a fresh, uncorrupted gradle-wrapper.jar file automatically
      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      # Compiles the pristine, production-ready .aab file 
      - name: Build Signed Release AAB
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-rush-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
