name: Build Signed Android App Bundle

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.6

      # This clears out any generic placeholder files and decodes your original secret
      - name: Decode Original Production Keystore
        run: |
          rm -f app/release.keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      # Verification step to ensure the key is placed correctly for Gradle
      - name: Verify Keystore Location
        run: ls -la app/

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Signed Release AAB
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-rush-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
      - name: Build Signed Release APK
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-rush-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-rush-release-apk
          path: app/build/outputs/apk/release/app-release.apk 
